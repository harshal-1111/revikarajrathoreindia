<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revikaraj Rathore India | Coming Soon</title>
  <meta name="description" content="Revikaraj Rathore India - A more exquisite experience awaits. Coming soon.">
  <meta name="theme-color" content="#3f0d14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="monogram">RR</div>
    <h1 class="brand">Revikaraj Rathore India</h1>
    <div class="ornament">
      <span class="dot"></span>
      <span class="diamond"></span>
      <span class="dot"></span>
    </div>
  </header>

  <!-- Coming soon section -->
  <main class="hero">
    <!-- Decorative circles -->
    <div class="circle circle-tl"></div>
    <div class="ring ring-tl-inner"></div>
    <div class="ring ring-tl-outer"></div>
    <div class="circle circle-br"></div>
    <div class="ring ring-br-inner"></div>
    <div class="ring ring-br-outer"></div>

    <!-- Inset frame with corner ornaments -->
    <div class="frame">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
    </div>

    <!-- Twinkling sparkles -->
    <span class="sparkle s1">&#10022;</span>
    <span class="sparkle s2">&#10022;</span>
    <span class="sparkle s3">&#10022;</span>
    <span class="sparkle s4">&#10022;</span>
    <span class="sparkle s5">&#10022;</span>
    <span class="sparkle s6">&#10022;</span>

    <div class="content">
      <div class="loader-wrap">
        <div class="loader">
          <span style="--i:0"></span>
          <span style="--i:1"></span>
          <span style="--i:2"></span>
          <span style="--i:3"></span>
          <span style="--i:4"></span>
          <span style="--i:5"></span>
          <span style="--i:6"></span>
          <span style="--i:7"></span>
          <span style="--i:8"></span>
          <span style="--i:9"></span>
          <span style="--i:10"></span>
          <span style="--i:11"></span>
        </div>
      </div>

      <h2 class="title">Coming Soon</h2>

      <div class="divider"><span>&#10022;</span></div>

      <p class="tagline">A more exquisite experience awaits</p>

      <a class="website" href="https://www.revikarajrathoreindia.com">www.revikarajrathoreindia.com</a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-ornament"><span>&#10022;</span></div>
    <div class="footer-monogram">RR</div>
    <p class="footer-brand">Revikaraj Rathore India</p>
    <p class="copyright">Copyright &copy; 2026 Revikaraj Rathore India - All Rights Reserved.</p>
  </footer>

</body>
</html>
